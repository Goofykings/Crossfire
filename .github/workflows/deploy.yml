# Build Crossfire and publish it to GitHub Pages.
# Generated assets (GLB, textures, audio) are committed, so CI does not need Blender.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Verify generated assets
        run: npm run assets:verify

      - name: Build
        run: npm run build
        env:
          # "./" works for any repository name. Set e.g. "/my-repo/" to force absolute URLs.
          BASE_PATH: ./
          VITE_MULTIPLAYER_URL: ${{ vars.VITE_MULTIPLAYER_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
