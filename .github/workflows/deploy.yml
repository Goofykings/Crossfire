name: Deploy Crossfire

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Keep release preparation on Cloudflare because the existing
# prepare-release.mjs currently requires the Cloudflare provider.
env:
  VITE_MULTIPLAYER_PROVIDER: cloudflare
  VITE_MULTIPLAYER_URL: ${{ vars.VITE_MULTIPLAYER_URL }}

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      protocol: ${{ steps.release.outputs.protocol }}
      health-url: ${{ steps.backend.outputs.health }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check release branch
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo '::error::Production releases must run from main. Choose main in Run workflow.'
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Prepare release configuration
        id: release
        run: node tools/prepare-release.mjs

      - name: Unit tests
        run: npm test

      - name: Deployment gate tests
        run: npm run test:deployment

      - name: Backend typecheck
        run: npm run typecheck --prefix server

      - name: Backend build and integration tests
        run: npm test --prefix server

      - name: Shared protocol compatibility with the real frontend client
        run: npm run test:protocol

      - name: Verify generated assets
        run: npm run assets:verify

      # Check the self-hosted backend before choosing the frontend configuration.
      - name: Check self-hosted backend
        id: custom
        continue-on-error: true
        run: |
          response=$(curl --fail --silent --show-error \
            --max-time 15 "$CUSTOM_HEALTH_URL")

          node -e '
            const data = JSON.parse(process.argv[1]);
            const expected = Number(process.argv[2]);

            if (!data.ok || Number(data.protocol) !== expected) {
              console.error("Self-hosted backend protocol mismatch.");
              process.exit(1);
            }

            console.log("Self-hosted backend is healthy.");
          ' "$response" "$EXPECTED_PROTOCOL"
        env:
          CUSTOM_HEALTH_URL: ${{ vars.CUSTOM_MULTIPLAYER_HEALTH_URL }}
          EXPECTED_PROTOCOL: ${{ steps.release.outputs.protocol }}

      - name: Select backend
        id: backend
        run: |
          if [ "${{ steps.custom.outcome }}" = "success" ]; then
            echo "provider=custom" >> "$GITHUB_OUTPUT"
            echo "url=${{ vars.VITE_CUSTOM_MULTIPLAYER_URL }}" >> "$GITHUB_OUTPUT"
            echo "health=${{ vars.CUSTOM_MULTIPLAYER_HEALTH_URL }}" >> "$GITHUB_OUTPUT"
            echo "Using self-hosted backend."
          else
            echo "provider=cloudflare" >> "$GITHUB_OUTPUT"
            echo "url=${{ vars.VITE_MULTIPLAYER_URL }}" >> "$GITHUB_OUTPUT"
            echo "health=${{ steps.release.outputs.health-url }}" >> "$GITHUB_OUTPUT"
            echo "Self-hosted backend unavailable. Using Cloudflare."
          fi

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ./
          VITE_MULTIPLAYER_PROVIDER: ${{ steps.backend.outputs.provider }}
          VITE_MULTIPLAYER_URL: ${{ vars.VITE_MULTIPLAYER_URL }}
          VITE_CUSTOM_MULTIPLAYER_URL: ${{ vars.VITE_CUSTOM_MULTIPLAYER_URL }}

      - name: Record frontend release
        run: node tools/prepare-release.mjs manifest

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/prepare-release.mjs credentials

      - name: Reject a stale release before changing production
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo '::error::A newer commit is on main. Run the workflow for the latest main commit.'
            exit 1
          fi

      # Keep the Cloudflare Worker updated as a working fallback.
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          wranglerVersion: ${{ steps.release.outputs.wrangler-version }}
          command: deploy --var RELEASE_SHA:${{ github.sha }}

      - name: Verify deployed Cloudflare Worker
        run: node tools/verify-release.mjs
        env:
          MULTIPLAYER_HEALTH_URL: ${{ steps.release.outputs.health-url }}
          EXPECTED_PROTOCOL: ${{ steps.release.outputs.protocol }}
          EXPECTED_RELEASE: ${{ github.sha }}

      - name: Verify selected backend before publishing
        run: |
          response=$(curl --fail --silent --show-error \
            --max-time 15 "$HEALTH_URL")

          node -e '
            const data = JSON.parse(process.argv[1]);
            const expected = Number(process.argv[2]);

            if (!data.ok || Number(data.protocol) !== expected) {
              console.error("Selected backend is unhealthy or incompatible.");
              process.exit(1);
            }
          ' "$response" "$EXPECTED_PROTOCOL"
        env:
          HEALTH_URL: ${{ steps.backend.outputs.health }}
          EXPECTED_PROTOCOL: ${{ steps.release.outputs.protocol }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Recheck selected backend before publishing Pages
        run: node tools/verify-release.mjs
        env:
          MULTIPLAYER_HEALTH_URL: ${{ needs.build.outputs.health-url }}
          EXPECTED_PROTOCOL: ${{ needs.build.outputs.protocol }}

      - id: deployment
        uses: actions/deploy-pages@v4
