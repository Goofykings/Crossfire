name: Deploy Crossfire

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Used only by prepare-release.mjs to generate release metadata.
# This does NOT deploy a Cloudflare Worker.
env:
  VITE_MULTIPLAYER_PROVIDER: cloudflare
  VITE_MULTIPLAYER_URL: wss://dust-tracy-heavily-encouraging.trycloudflare.com/ws

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      protocol: ${{ steps.release.outputs.protocol }}
      health-url: ${{ steps.backend.outputs.health }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check release branch
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo '::error::Production releases must run from main.'
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Prepare release configuration
        id: release
        run: node tools/prepare-release.mjs

      - name: Unit tests
        run: npm test

      - name: Deployment gate tests
        run: npm run test:deployment

      - name: Backend typecheck
        run: npm run typecheck --prefix server

      - name: Backend build and integration tests
        run: npm test --prefix server

      - name: Shared protocol compatibility with the real frontend client
        run: npm run test:protocol

      - name: Verify generated assets
        run: npm run assets:verify

      - name: Check self-hosted backend
        id: custom
        env:
          CUSTOM_HEALTH_URL: https://dust-tracy-heavily-encouraging.trycloudflare.com/health
          EXPECTED_PROTOCOL: ${{ steps.release.outputs.protocol }}
        run: |
          response="$(curl --fail --silent --show-error --max-time 15 "$CUSTOM_HEALTH_URL")"

          node -e '
            const data = JSON.parse(process.argv[1]);
            const expected = Number(process.argv[2]);

            if (!data.ok || Number(data.protocol) !== expected) {
              console.error("Self-hosted backend is unhealthy or protocol-incompatible.");
              process.exit(1);
            }

            console.log("Self-hosted backend is healthy.");
          ' "$response" "$EXPECTED_PROTOCOL"

          echo "health=$CUSTOM_HEALTH_URL" >> "$GITHUB_OUTPUT"

      - name: Select self-hosted backend
        id: backend
        run: |
          echo "provider=custom" >> "$GITHUB_OUTPUT"
          echo "url=wss://dust-tracy-heavily-encouraging.trycloudflare.com/ws" >> "$GITHUB_OUTPUT"
          echo "health=https://dust-tracy-heavily-encouraging.trycloudflare.com/health" >> "$GITHUB_OUTPUT"
          echo "Using the self-hosted Ubuntu backend."

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ./
          VITE_MULTIPLAYER_PROVIDER: custom
          VITE_MULTIPLAYER_URL: wss://dust-tracy-heavily-encouraging.trycloudflare.com/ws
          VITE_CUSTOM_MULTIPLAYER_URL: wss://dust-tracy-heavily-encouraging.trycloudflare.com/ws

      - name: Record frontend release
        run: node tools/prepare-release.mjs manifest

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Reject a stale release before publishing
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo '::error::A newer commit is on main. Run the workflow for the latest main commit.'
            exit 1
          fi

      - name: Verify selected backend before publishing
        run: node tools/verify-release.mjs
        env:
          MULTIPLAYER_HEALTH_URL: ${{ steps.backend.outputs.health }}
          EXPECTED_PROTOCOL: ${{ steps.release.outputs.protocol }}
          EXPECTED_RELEASE: ${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Recheck self-hosted backend before publishing Pages
        run: node tools/verify-release.mjs
        env:
          MULTIPLAYER_HEALTH_URL: https://dust-tracy-heavily-encouraging.trycloudflare.com/health
          EXPECTED_PROTOCOL: ${{ needs.build.outputs.protocol }}
          EXPECTED_RELEASE: ${{ github.sha }}

      - id: deployment
        uses: actions/deploy-pages@v4
